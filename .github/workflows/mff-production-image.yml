name: MUSITU Financial Fabric — Production OCI Candidate

on:
  push:
    branches: [musitu-financial-fabric-production-readiness]
    paths:
      - 'musitu_financial_fabric/app/**'
      - 'musitu_financial_fabric/pyproject.toml'
      - 'musitu_financial_fabric/constraints-ci.txt'
      - 'deploy/musitu-financial-fabric/Dockerfile'
      - 'deploy/musitu-financial-fabric/Dockerfile.dockerignore'
      - '.github/workflows/mff-production-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MUSITU_IMAGE: musitu-financial-fabric:ci
  MUSITU_PYTHON_BASE: python:3.12.14-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
  MUSITU_POSTGRES_CI_IMAGE: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
  MUSITU_TIGERBEETLE_CI_IMAGE: ghcr.io/tigerbeetle/tigerbeetle@sha256:b140e2285fcc1ccd6a7a38a1e31ef13f98c3b511b29acc0a935d597546aa96ff
  MUSITU_MOBY_PROFILES_COMMIT: 61eaf32614c7c71b60bd8927d3e6a4ffc8ff1f31

jobs:
  production-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify and pull pinned Python base
        shell: bash
        run: |
          set -euo pipefail
          grep -F "FROM $MUSITU_PYTHON_BASE" deploy/musitu-financial-fabric/Dockerfile
          docker pull "$MUSITU_PYTHON_BASE"
          docker image inspect "$MUSITU_PYTHON_BASE" --format '{{json .RepoDigests}}' | tee /tmp/musitu-python-base.txt
          grep -F 'sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254' /tmp/musitu-python-base.txt

      - name: Build exact production candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --file deploy/musitu-financial-fabric/Dockerfile \
            --build-arg MUSITU_BUILD_COMMIT="$GITHUB_SHA" \
            --tag "$MUSITU_IMAGE" \
            .
          docker image inspect "$MUSITU_IMAGE" --format '{{.Id}}' | tee /tmp/musitu-image-id.txt

      - name: Verify image identity and non-root contract
        shell: bash
        run: |
          set -euo pipefail
          user="$(docker image inspect "$MUSITU_IMAGE" --format '{{.Config.User}}')"
          revision="$(docker image inspect "$MUSITU_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          embedded_revision="$(docker image inspect "$MUSITU_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1 == "MUSITU_BUILD_COMMIT" {print substr($0, index($0, "=") + 1)}')"
          test "$user" = '65532:65532'
          test "$revision" = "$GITHUB_SHA"
          test "$embedded_revision" = "$GITHUB_SHA"
          {
            echo "image_id=$(cat /tmp/musitu-image-id.txt)"
            echo "runtime_user=$user"
            echo "revision=$revision"
            echo "embedded_runtime_revision=$embedded_revision"
            echo "base=$MUSITU_PYTHON_BASE"
          } | tee /tmp/musitu-image-contract.txt

      - name: Prove read-only sandbox runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name musitu-image-sandbox \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e MUSITU_ENV=sandbox \
            -e MUSITU_DB_PATH=/tmp/musitu-network.db \
            -p 18000:8000 \
            "$MUSITU_IMAGE"

          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18000/health >/tmp/musitu-image-sandbox-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs musitu-image-sandbox; exit 1; fi

          if docker exec musitu-image-sandbox sh -c 'touch /opt/musitu/must-not-write'; then
            echo 'read-only root filesystem was unexpectedly writable' >&2
            exit 1
          fi
          cat /tmp/musitu-image-sandbox-health.json | tee /tmp/musitu-image-sandbox-proof.txt

      - name: Prepare pinned TigerBeetle-compatible seccomp profile
        shell: bash
        run: |
          set -euo pipefail
          profile_repo="$RUNNER_TEMP/moby-profiles"
          profile_out="$RUNNER_TEMP/musitu-tigerbeetle-seccomp.json"
          git init "$profile_repo"
          git -C "$profile_repo" remote add origin https://github.com/moby/profiles.git
          git -C "$profile_repo" fetch --depth 1 origin "$MUSITU_MOBY_PROFILES_COMMIT"
          git -C "$profile_repo" checkout --detach FETCH_HEAD
          test "$(git -C "$profile_repo" rev-parse HEAD)" = "$MUSITU_MOBY_PROFILES_COMMIT"

          python3 - "$profile_repo/seccomp/default.json" "$profile_out" <<'PY'
          import json
          import sys

          source, destination = sys.argv[1:3]
          profile = json.load(open(source, encoding='utf-8'))
          assert profile.get('defaultAction') == 'SCMP_ACT_ERRNO', profile.get('defaultAction')
          required = {'io_uring_setup', 'io_uring_enter', 'io_uring_register'}
          already_allowed = {
              name
              for rule in profile.get('syscalls', [])
              if rule.get('action') == 'SCMP_ACT_ALLOW'
              for name in rule.get('names', [])
          }
          overlap = required & already_allowed
          assert not overlap, f'Pinned Moby profile unexpectedly already permits: {sorted(overlap)}'
          profile['syscalls'].insert(0, {
              'names': sorted(required),
              'action': 'SCMP_ACT_ALLOW',
          })
          json.dump(profile, open(destination, 'w', encoding='utf-8'), indent=2, sort_keys=False)
          with open(destination, 'a', encoding='utf-8') as handle:
              handle.write('\n')
          allowed_after = {
              name
              for rule in profile['syscalls']
              if rule.get('action') == 'SCMP_ACT_ALLOW'
              for name in rule.get('names', [])
          }
          assert required <= allowed_after
          assert profile['defaultAction'] == 'SCMP_ACT_ERRNO'
          PY

          python3 -m json.tool "$profile_out" >/dev/null
          sha256sum "$profile_out" | tee /tmp/musitu-seccomp.sha256
          printf 'moby_profiles_commit=%s\n' "$MUSITU_MOBY_PROFILES_COMMIT" | tee /tmp/musitu-seccomp-source.txt
          grep -F 'SCMP_ACT_ERRNO' "$profile_out" >/dev/null
          grep -F 'io_uring_setup' "$profile_out" >/dev/null
          grep -F 'io_uring_enter' "$profile_out" >/dev/null
          grep -F 'io_uring_register' "$profile_out" >/dev/null

      - name: Start pinned monetary services
        shell: bash
        run: |
          set -euo pipefail
          seccomp="$RUNNER_TEMP/musitu-tigerbeetle-seccomp.json"
          test -s "$seccomp"

          docker run -d --name musitu-image-pg \
            -e POSTGRES_PASSWORD=musitu-ci \
            -p 5432:5432 \
            "$MUSITU_POSTGRES_CI_IMAGE"

          pg_ready=0
          for i in {1..60}; do
            if docker exec musitu-image-pg pg_isready -U postgres >/dev/null 2>&1; then
              sleep 2
              if docker exec musitu-image-pg pg_isready -U postgres >/dev/null 2>&1; then pg_ready=1; break; fi
            fi
            sleep 1
          done
          if [ "$pg_ready" != 1 ]; then docker logs musitu-image-pg; exit 1; fi

          mkdir -p "$RUNNER_TEMP/tb-image"
          docker run --rm --security-opt seccomp="$seccomp" \
            -v "$RUNNER_TEMP/tb-image:/data" "$MUSITU_TIGERBEETLE_CI_IMAGE" \
            format --cluster=1 --replica=0 --replica-count=1 /data/0_0.tigerbeetle
          docker run -d --name musitu-image-tb --security-opt seccomp="$seccomp" \
            -p 3000:3000 -v "$RUNNER_TEMP/tb-image:/data" "$MUSITU_TIGERBEETLE_CI_IMAGE" \
            start --addresses=0.0.0.0:3000 --cache-grid=256MiB /data/0_0.tigerbeetle

          tb_ready=0
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/3000) >/dev/null 2>&1; then tb_ready=1; break; fi
            sleep 1
          done
          if [ "$tb_ready" != 1 ]; then docker logs musitu-image-tb; exit 1; fi

      - name: Prove packaged dark-production data plane
        shell: bash
        run: |
          set -euo pipefail
          seccomp="$RUNNER_TEMP/musitu-tigerbeetle-seccomp.json"
          test -s "$seccomp"
          docker run -d --name musitu-image-production \
            --network host \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt seccomp="$seccomp" \
            -e MUSITU_ENV=production \
            -e MUSITU_LIVE_FUNDS_ENABLED=false \
            -e MUSITU_PRODUCTION_MODE=shadow \
            -e MUSITU_METADATA_DB_URL=postgresql://postgres:musitu-ci@127.0.0.1:5432/postgres \
            -e MUSITU_LEDGER_BACKEND=tigerbeetle \
            -e MUSITU_TIGERBEETLE_CLUSTER_ID=1 \
            -e MUSITU_TIGERBEETLE_ADDRESSES=127.0.0.1:3000 \
            -e MUSITU_AUTH_INTROSPECTION_URL=http://127.0.0.1:18080/introspect \
            -e MUSITU_AUTH_CLIENT_ID=musitu-image-ci \
            -e MUSITU_AUTH_CLIENT_SECRET=ci-only-placeholder-value-0123456789 \
            -e MUSITU_AUTH_REQUIRED_SCOPE=musitu.payments \
            -e MUSITU_AUTHZ_GATE_URL=http://127.0.0.1:18081/decision \
            -e MUSITU_RISK_GATE_URL=http://127.0.0.1:18082/decision \
            -e MUSITU_ECOCASH_WEBHOOK_SECRET=0123456789abcdef0123456789abcdef \
            "$MUSITU_IMAGE"

          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/musitu-image-production-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs musitu-image-production; exit 1; fi

          docker exec -i musitu-image-production python - <<'PY' | tee /tmp/musitu-image-production-proof.txt
          from app.ledger import balance, create_account, post
          from app.production import production_readiness
          from app.reconciliation import reconcile_monetary_truth

          source = create_account('system', 'oci-source', 'USD', 'rail_clearing')
          destination = create_account('merchant', 'oci-destination', 'USD', 'settlement')
          journal = post(
              reference='oci-production-shadow-proof',
              memo='Packaged production-shadow monetary proof',
              postings=[(source['id'], -37), (destination['id'], 37)],
          )
          assert journal
          assert balance(source['id']) == -37
          assert balance(destination['id']) == 37
          truth = reconcile_monetary_truth()
          assert truth['applicable'] is True and truth['consistent'] is True, truth
          readiness = production_readiness()
          assert readiness['ready_for_live_funds'] is False, readiness
          print('PASS: packaged dark-production PostgreSQL/TigerBeetle path reconciles and live funds remain closed')
          PY

          cat /tmp/musitu-image-production-health.json >> /tmp/musitu-image-production-proof.txt

      - name: Capture image evidence
        if: always()
        shell: bash
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo '=== image contract ==='
            cat /tmp/musitu-image-contract.txt 2>/dev/null || true
            echo '=== base ==='
            cat /tmp/musitu-python-base.txt 2>/dev/null || true
            echo '=== seccomp source ==='
            cat /tmp/musitu-seccomp-source.txt 2>/dev/null || true
            cat /tmp/musitu-seccomp.sha256 2>/dev/null || true
            echo '=== sandbox ==='
            cat /tmp/musitu-image-sandbox-proof.txt 2>/dev/null || true
            echo '=== production shadow ==='
            cat /tmp/musitu-image-production-proof.txt 2>/dev/null || true
          } | tee /tmp/musitu-production-image-evidence.txt
          docker ps -a || true

      - name: Upload production image evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musitu-production-image-evidence
          path: /tmp/musitu-production-image-evidence.txt

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f musitu-image-production musitu-image-sandbox musitu-image-tb musitu-image-pg >/dev/null 2>&1 || true

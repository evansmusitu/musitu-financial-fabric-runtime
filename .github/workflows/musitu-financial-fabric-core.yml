name: MUSITU Financial Fabric — Core Gate

on:
  push:
    branches: [musitu-financial-fabric, musitu-financial-fabric-production-readiness]
    paths:
      - 'musitu_financial_fabric/**'
      - '.github/workflows/musitu-financial-fabric-*.yml'
  pull_request:
    paths:
      - 'musitu_financial_fabric/**'
      - '.github/workflows/musitu-financial-fabric-*.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: musitu_financial_fabric
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: musitu_financial_fabric/pyproject.toml
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q app scripts tests
      - name: Unit and integration tests
        run: pytest -q
      - name: Verify mandatory manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('stack/required-components.json').read_text())
          assert p['all_required'] is True
          assert len(p['components']) == 39, len(p['components'])
          assert all(x['required'] is True for x in p['components'])
          print('mandatory-components=39 all_required=true')
          PY
      - name: Boot API and smoke endpoints
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/musitu-api.log 2>&1 &
          echo $! > /tmp/musitu-api.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8000/v1/fabric/components > /tmp/components.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/components.json'))
          assert p['required'] is True
          assert len(p['components']) == 39
          PY
          code=$(curl -sS -o /tmp/mpp.json -w '%{http_code}' 'http://127.0.0.1:8000/mpp/challenge?amount_minor=1&currency=USD&resource=test')
          test "$code" = 402
          code=$(curl -sS -o /tmp/x402.json -w '%{http_code}' 'http://127.0.0.1:8000/x402/challenge?amount_minor=1&currency=USD&resource=test')
          test "$code" = 402
          kill "$(cat /tmp/musitu-api.pid)"
      - name: Confirm Docker-capable GitHub runner
        run: docker version && docker compose version

  tooling:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: musitu_financial_fabric
    env:
      OPENAPI_GENERATOR_VERSION: '7.24.0'
      SCARF_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@e78d7d0ad4827834deec3f34fd24767f9f9b8f2b # v3
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install mandatory API tooling at exact versions
        run: npm install -g @openapitools/openapi-generator-cli@2.41.0 @stoplight/prism-cli@5.16.0
      - name: Verify mandatory tooling identities
        run: |
          cosign version
          tofu version
          npm list -g --depth=0 | tee /tmp/musitu-global-npm.txt
          grep -F '@openapitools/openapi-generator-cli@2.41.0' /tmp/musitu-global-npm.txt
          grep -F '@stoplight/prism-cli@5.16.0' /tmp/musitu-global-npm.txt
          generator_version="$(openapi-generator-cli version | tail -n 1 | tr -d '\r')"
          test "$generator_version" = "$OPENAPI_GENERATOR_VERSION"
          prism --version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Generate MUSITU OpenAPI and SDK
        run: |
          python -m pip install -e .
          python - <<'PY'
          import json
          from app.main import app
          open('musitu-openapi.json','w').write(json.dumps(app.openapi(), indent=2))
          PY
          openapi-generator-cli generate -i musitu-openapi.json -g python -o generated-sdk/python >/tmp/openapi-generator.log 2>&1
          test -f generated-sdk/python/README.md
      - name: Validate OpenTofu
        run: tofu -chdir=infra init -backend=false && tofu -chdir=infra validate

name: MUSITU Financial Fabric — Provider-Neutral Target Staging

on:
  push:
    branches: [musitu-financial-fabric-provider-neutral-target-staging-20260912]
    paths:
      - 'deploy/musitu-financial-fabric/provider-neutral/**'
      - 'musitu_financial_fabric/scripts/validate_provider_neutral_target.py'
      - 'musitu_financial_fabric/scripts/validate_provider_neutral_deployability.py'
      - 'musitu_financial_fabric/scripts/validate_benchmark_evidence.py'
      - 'musitu_financial_fabric/scripts/validate_recovery_profiles.py'
      - 'musitu_financial_fabric/scripts/validate_identity_secret_profiles.py'
      - 'musitu_financial_fabric/scripts/validate_identity_secret_target_evidence.py'
      - 'musitu_financial_fabric/scripts/validate_operational_profiles.py'
      - 'musitu_financial_fabric/scripts/validate_operational_target_evidence.py'
      - 'musitu_financial_fabric/scripts/validate_supply_persistence_profiles.py'
      - 'musitu_financial_fabric/scripts/validate_persistence_target_evidence.py'
      - 'musitu_financial_fabric/scripts/validate_resource_profiles.py'
      - 'musitu_financial_fabric/scripts/validate_resource_target_evidence.py'
      - 'musitu_financial_fabric/scripts/validate_manifest_profiles.py'
      - 'musitu_financial_fabric/stack/required-components.json'
      - '.github/workflows/mff-provider-neutral-target-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-target-contract:
    name: Static provider-neutral target contract only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Validate exact 26-runtime structural contract and fail-closed foundation
        run: python musitu_financial_fabric/scripts/validate_provider_neutral_target.py --structure
      - name: Exercise benchmark evidence validator
        run: python musitu_financial_fabric/scripts/validate_provider_neutral_target.py --self-test
      - name: Exercise raw benchmark evidence byte-binding gate
        run: python musitu_financial_fabric/scripts/validate_benchmark_evidence.py --self-test
      - name: Validate all currently measured benchmark evidence rows
        run: python musitu_financial_fabric/scripts/validate_benchmark_evidence.py --contract
      - name: Exercise authoritative recovery-profile integrity gate
        run: python musitu_financial_fabric/scripts/validate_recovery_profiles.py --self-test
      - name: Validate authoritative recovery-profile scope
        run: python musitu_financial_fabric/scripts/validate_recovery_profiles.py --contract
      - name: Exercise workload identity and secret-profile integrity gate
        run: python musitu_financial_fabric/scripts/validate_identity_secret_profiles.py --self-test
      - name: Validate resolved workload identity and secret profiles
        run: python musitu_financial_fabric/scripts/validate_identity_secret_profiles.py --contract
      - name: Exercise workload identity and secret target-evidence association gate
        run: python musitu_financial_fabric/scripts/validate_identity_secret_target_evidence.py --self-test
      - name: Validate resolved workload identity and secret target-evidence descriptors
        run: python musitu_financial_fabric/scripts/validate_identity_secret_target_evidence.py --contract
      - name: Exercise probe, network, disruption, and topology profile integrity gate
        run: python musitu_financial_fabric/scripts/validate_operational_profiles.py --self-test
      - name: Validate resolved operational profiles
        run: python musitu_financial_fabric/scripts/validate_operational_profiles.py --contract
      - name: Exercise operational target-evidence association gate
        run: python musitu_financial_fabric/scripts/validate_operational_target_evidence.py --self-test
      - name: Validate resolved operational target-evidence descriptors
        run: python musitu_financial_fabric/scripts/validate_operational_target_evidence.py --contract
      - name: Exercise image provenance and persistence-profile integrity gate
        run: python musitu_financial_fabric/scripts/validate_supply_persistence_profiles.py --self-test
      - name: Validate resolved image provenance and persistence profiles
        run: python musitu_financial_fabric/scripts/validate_supply_persistence_profiles.py --contract
      - name: Exercise persistence target-evidence association gate
        run: python musitu_financial_fabric/scripts/validate_persistence_target_evidence.py --self-test
      - name: Validate resolved persistence target-evidence descriptors
        run: python musitu_financial_fabric/scripts/validate_persistence_target_evidence.py --contract
      - name: Exercise measured resource-profile integrity gate
        run: python musitu_financial_fabric/scripts/validate_resource_profiles.py --self-test
      - name: Validate resolved measured resource profiles
        run: python musitu_financial_fabric/scripts/validate_resource_profiles.py --contract
      - name: Exercise resource target-evidence association gate
        run: python musitu_financial_fabric/scripts/validate_resource_target_evidence.py --self-test
      - name: Validate resolved resource target-evidence descriptors
        run: python musitu_financial_fabric/scripts/validate_resource_target_evidence.py --contract
      - name: Exercise rendered manifest evidence integrity gate
        run: python musitu_financial_fabric/scripts/validate_manifest_profiles.py --self-test
      - name: Validate resolved runtime manifests
        run: python musitu_financial_fabric/scripts/validate_manifest_profiles.py --contract
      - name: Exercise canonical deployability composition gate
        run: python musitu_financial_fabric/scripts/validate_provider_neutral_deployability.py --self-test
      - name: Prove canonical target gate is intentionally not deployable yet
        shell: bash
        run: |
          set +e
          output="$(python musitu_financial_fabric/scripts/validate_provider_neutral_deployability.py --contract 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo 'ERROR: canonical staging gate unexpectedly declared itself deployable.' >&2
            exit 1
          fi
          if [ "$rc" -ne 3 ]; then
            echo "ERROR: expected fail-closed canonical deployability exit 3, got $rc" >&2
            exit 1
          fi
          if ! grep -q '^NOT DEPLOYABLE: 365 unresolved fail-closed conditions$' <<<"$output"; then
            echo 'ERROR: canonical deployability blocker count drifted from the qualified 365-condition frontier.' >&2
            exit 1
          fi
          echo 'PASS: canonical semantic + structural gate remains intentionally non-deployable at exactly 365 blockers.'
      - name: Record claim boundary
        if: always()
        run: |
          echo 'Static architecture evidence only.'
          echo 'No kubectl apply, Helm install, cloud plan/apply, production deployment, target-health proof, live-funds authorization, or independent certification occurred.'

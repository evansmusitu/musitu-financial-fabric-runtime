name: MUSITU Financial Fabric — Hyperswitch

on:
  push:
    branches: [musitu-financial-fabric, musitu-financial-fabric-production-readiness]
    paths:
      - 'control/musitu-financial-fabric/**'
      - '.github/workflows/musitu-financial-fabric-hyperswitch.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HYPERSWITCH_UPSTREAM_SHA: aa475770f45becf3db0cc510dbb7fe39f5f96053

jobs:
  hyperswitch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Acquire exact official Hyperswitch revision
        run: |
          git init /tmp/hyperswitch
          git -C /tmp/hyperswitch remote add origin https://github.com/juspay/hyperswitch.git
          git -C /tmp/hyperswitch fetch --depth 1 origin "$HYPERSWITCH_UPSTREAM_SHA"
          git -C /tmp/hyperswitch checkout --detach FETCH_HEAD
          test "$(git -C /tmp/hyperswitch rev-parse HEAD)" = "$HYPERSWITCH_UPSTREAM_SHA"
      - name: Record upstream revision and patch identity
        working-directory: /tmp/hyperswitch
        run: |
          git rev-parse HEAD | tee /tmp/hyperswitch.sha
          cp crates/diesel_models/drop_id.patch /tmp/hyperswitch-drop-id-upstream.patch
          sha256sum crates/diesel_models/drop_id.patch | tee /tmp/hyperswitch-drop-id-upstream.sha256
      - name: Apply exact CI diagnostics and Superposition init workaround
        working-directory: /tmp/hyperswitch
        run: |
          python - <<'PY'
          from pathlib import Path

          compose = Path('docker-compose.yml')
          text = compose.read_text()
          old = 'command: sh -c "apk add --no-cache curl jq yq && sh /seed_superposition.sh"'
          new = 'command: sh -c "apk add --no-cache bash curl jq yq && bash /seed_superposition.sh"'
          if old not in text:
              raise SystemExit('Upstream compose signature changed; refusing an unverified patch')
          compose.write_text(text.replace(old, new, 1))

          setup = Path('scripts/setup.sh')
          text = setup.read_text()
          old = '''    scarf_call
              cleanup
              exit $exit_code'''.replace('      ', '')
          new = '''    scarf_call
              if [ "${MUSITU_CI_PRESERVE_FAILED_STACK:-}" != "1" ]; then
                  cleanup
              fi
              exit $exit_code'''.replace('      ', '')
          if old not in text:
              raise SystemExit('Upstream setup error-handler signature changed; refusing an unverified diagnostics patch')
          setup.write_text(text.replace(old, new, 1))
          PY
          grep -F 'bash /seed_superposition.sh' docker-compose.yml
          grep -F 'MUSITU_CI_PRESERVE_FAILED_STACK' scripts/setup.sh
      - name: Remove only the proven redundant Diesel patch hunk
        working-directory: /tmp/hyperswitch
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          patch = Path('crates/diesel_models/drop_id.patch')
          raw = patch.read_bytes()
          expected_sha256 = '7b0b6e5c5965e03355ad76cf24975ee83061e4c8a56a7c7ffdfe0b4ff4c2a36b'
          actual_sha256 = sha256(raw).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'Unexpected upstream drop_id.patch SHA-256: {actual_sha256}')

          stale_hunk = b'''@@ -1982,6 +1999,7 @@\n     api_keys,\n     authentication,\n     batch_blocklist_jobs,\n+    blocklist,\n     blocklist_fingerprint,\n     blocklist_lookup,\n     business_profile,\n'''
          if raw.count(stale_hunk) != 1 or not raw.endswith(stale_hunk):
              raise SystemExit('Proven stale hunk signature changed; refusing workaround')
          patched = raw[:-len(stale_hunk)]
          patch.write_bytes(patched)
          print('Removed exactly redundant hunk #5; hunks #1-#4 remain intact')
          PY
          grep -F 'blocklist_fingerprint (merchant_id, fingerprint_id)' crates/diesel_models/drop_id.patch
          if grep -Fq '@@ -1982,6 +1999,7 @@' crates/diesel_models/drop_id.patch; then
            echo 'stale hunk still present' >&2
            exit 1
          fi
      - name: Start official standalone stack
        working-directory: /tmp/hyperswitch
        env:
          MUSITU_CI_PRESERVE_FAILED_STACK: '1'
        run: printf '3\n' | scripts/setup.sh
      - name: Verify generated Diesel schema invariants
        working-directory: /tmp/hyperswitch
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('crates/diesel_models/src/schema.rs').read_text()
          required = [
              'blocklist (merchant_id, fingerprint_id)',
              'blocklist_fingerprint (merchant_id, fingerprint_id)',
              'blocklist_lookup (merchant_id, fingerprint)',
              'configs (key)',
              'locker_mock_up (card_id)',
              'batch_blocklist_jobs,\n    blocklist,\n    blocklist_fingerprint,',
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit(f'Generated Diesel schema invariant missing: {missing}')
          print('Generated Diesel schema contains all required post-patch invariants')
          PY
      - name: Verify Hyperswitch health and deep readiness
        run: |
          health_ok=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/health 2>/dev/null | tee /tmp/hyperswitch-health.txt | grep -q 'health is good'; then
              health_ok=1
              break
            fi
            sleep 2
          done
          if [ "$health_ok" -ne 1 ]; then
            echo 'Hyperswitch did not reach stable /health within the bounded readiness window' >&2
            docker ps -a
            docker logs hyperswitch-hyperswitch-server-1 --tail 200 || true
            exit 1
          fi

          ready_ok=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/health/ready > /tmp/hyperswitch-ready.json 2>/dev/null \
              && python -c "import json; p=json.load(open('/tmp/hyperswitch-ready.json')); assert p.get('error') is None, p"; then
              ready_ok=1
              break
            fi
            sleep 2
          done
          if [ "$ready_ok" -ne 1 ]; then
            echo 'Hyperswitch did not reach deep readiness within the bounded readiness window' >&2
            cat /tmp/hyperswitch-ready.json 2>/dev/null || true
            docker ps -a
            docker logs hyperswitch-hyperswitch-server-1 --tail 200 || true
            exit 1
          fi
      - name: Capture containers, image identities, and failure logs
        if: always()
        working-directory: /tmp/hyperswitch
        run: |
          docker ps -a | tee /tmp/hyperswitch-containers.txt
          docker ps -a --format '{{.Image}}' | sort -u | while read -r image; do
            [ -n "$image" ] || continue
            printf '%s ' "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}' || true
          done | tee /tmp/hyperswitch-image-digests.txt
          docker compose logs --no-color migration_runner > /tmp/hyperswitch-migration-runner.log 2>&1 || true
          docker compose logs --no-color superposition-init > /tmp/hyperswitch-superposition-init.log 2>&1 || true
          docker compose logs --no-color hyperswitch-server > /tmp/hyperswitch-server.log 2>&1 || true
          cp crates/diesel_models/src/schema.rs /tmp/hyperswitch-generated-schema.rs || true
          cp crates/diesel_models/drop_id.patch /tmp/hyperswitch-drop-id-effective.patch || true
      - name: Upload evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musitu-hyperswitch-evidence
          path: |
            /tmp/hyperswitch.sha
            /tmp/hyperswitch-health.txt
            /tmp/hyperswitch-ready.json
            /tmp/hyperswitch-containers.txt
            /tmp/hyperswitch-image-digests.txt
            /tmp/hyperswitch-migration-runner.log
            /tmp/hyperswitch-superposition-init.log
            /tmp/hyperswitch-server.log
            /tmp/hyperswitch-generated-schema.rs
            /tmp/hyperswitch-drop-id-upstream.patch
            /tmp/hyperswitch-drop-id-upstream.sha256
            /tmp/hyperswitch-drop-id-effective.patch

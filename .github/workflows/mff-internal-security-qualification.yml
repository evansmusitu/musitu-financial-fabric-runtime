name: MUSITU Financial Fabric — Internal Security Qualification

on:
  push:
    branches: [musitu-financial-fabric-internal-security-qualification-20260912]
    paths:
      - 'musitu_financial_fabric/**'
      - 'docs/internal-security/**'
      - '.github/workflows/mff-internal-security-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-security-qualification:
    name: Internal security qualification only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: musitu_financial_fabric

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'

      - name: Install evidence-locked application and tests
        run: |
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Install pinned defensive scanners
        run: python -m pip install 'pip-audit==2.10.1' 'bandit==1.9.4' 'detect-secrets==1.5.0'

      - name: Audit pinned Python dependencies
        run: python -m pip_audit -r constraints-ci.txt --progress-spinner off

      - name: Generate CycloneDX dependency SBOM and evidence hashes
        run: |
          python -m pip_audit -r constraints-ci.txt --progress-spinner off --format cyclonedx-json --output "$RUNNER_TEMP/mff-python-sbom.cdx.json"
          python - "$RUNNER_TEMP/mff-python-sbom.cdx.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          sbom_path = Path(sys.argv[1])
          raw = sbom_path.read_bytes()
          payload = json.loads(raw)
          if payload.get("bomFormat") != "CycloneDX":
              raise SystemExit("SBOM is not CycloneDX")
          components = payload.get("components") or []
          if not components:
              raise SystemExit("SBOM contains no components")
          lock_raw = Path("constraints-ci.txt").read_bytes()
          print(f"PASS: CycloneDX SBOM generated with {len(components)} components")
          print(f"SBOM_SHA256={hashlib.sha256(raw).hexdigest()}")
          print(f"CONSTRAINTS_SHA256={hashlib.sha256(lock_raw).hexdigest()}")
          print("BOUNDARY: SBOM is internal dependency evidence, not independent supply-chain certification")
          PY

      - name: Scan repository content for likely committed secrets
        run: |
          cd ..
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > "$RUNNER_TEMP/mff-detect-secrets.json"
          python - "$RUNNER_TEMP/mff-detect-secrets.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          report_path = Path(sys.argv[1])
          raw = report_path.read_bytes()
          report = json.loads(raw)
          findings = []
          for filename, rows in sorted((report.get("results") or {}).items()):
              for row in rows or []:
                  findings.append((filename, row.get("type"), row.get("line_number")))
          if findings:
              for filename, kind, line_number in findings:
                  print("POTENTIAL_SECRET", filename, kind, line_number)
              raise SystemExit(f"potential committed secrets require adjudication: {len(findings)}")
          print("PASS: no likely committed secrets detected by detect-secrets 1.5.0")
          print(f"SECRET_SCAN_SHA256={hashlib.sha256(raw).hexdigest()}")
          print("BOUNDARY: this is MUSITU internal repository scanning, not external secret-management certification")
          PY

      - name: Validate structured internal threat model and evidence references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          repo = Path.cwd().parent
          model_path = repo / "docs" / "internal-security" / "THREAT_MODEL_20260912.json"
          model = json.loads(model_path.read_text(encoding="utf-8"))
          if model.get("schema_version") != "mff.internal-threat-model.v1":
              raise SystemExit("unexpected threat-model schema")
          threats = model.get("threats") or []
          ids = [row.get("id") for row in threats]
          if len(threats) < 16 or len(set(ids)) != len(ids) or any(not value for value in ids):
              raise SystemExit("threat inventory is incomplete or has duplicate/empty IDs")
          allowed = {"internally_tested", "partial", "open_target", "open_external"}
          statuses = {row.get("status") for row in threats}
          if not statuses <= allowed or not {"partial", "open_target", "open_external"} <= statuses:
              raise SystemExit(f"threat statuses violate fail-closed vocabulary: {sorted(statuses)}")
          missing = []
          for threat in threats:
              refs = threat.get("evidence_refs") or []
              if not refs:
                  missing.append(f"{threat.get('id')}: no evidence_refs")
              for ref in refs:
                  if not (repo / ref).is_file():
                      missing.append(f"{threat.get('id')}: missing {ref}")
          if missing:
              raise SystemExit("\n".join(missing))
          print(f"PASS: {len(threats)} internal threat-model rows validated with existing evidence references")
          print("PASS: open target/external/partial residuals remain explicitly open")
          PY

      - name: Static Python security analysis with exact false-positive adjudication
        run: |
          bandit -r app -ll -ii -f json -o "$RUNNER_TEMP/bandit.json" || true
          python - "$RUNNER_TEMP/bandit.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          accepted = []
          unexpected = []
          for finding in report.get("results", []):
              marker = (
                  finding.get("test_id"),
                  finding.get("filename", "").replace("\\", "/"),
                  finding.get("line_number"),
              )
              if marker == ("B608", "app/service.py", 356):
                  accepted.append(finding)
              else:
                  unexpected.append(finding)
          if unexpected:
              for finding in unexpected:
                  print(
                      "UNEXPECTED",
                      finding.get("test_id"),
                      finding.get("filename"),
                      finding.get("line_number"),
                      finding.get("issue_severity"),
                      finding.get("issue_confidence"),
                  )
              raise SystemExit(1)
          if len(accepted) != 1:
              raise SystemExit(f"expected exactly one adjudicated B608 finding, found {len(accepted)}")
          print("PASS: only the exact adjudicated B608 trusted-literal query construction remains")
          PY

      - name: Compile and run complete test suite
        run: |
          python -m compileall -q app tests
          pytest -q

      - name: Record qualification boundary
        if: always()
        run: |
          echo 'MUSITU internal security qualification only.'
          echo 'Not independent validation, certification, regulatory approval, production authorization, or proof of a deployed target.'

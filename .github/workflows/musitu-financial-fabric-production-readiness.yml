name: MUSITU Financial Fabric — Production Readiness

on:
  push:
    branches: [musitu-financial-fabric-production-readiness]
    paths:
      - 'musitu_financial_fabric/**'
      - 'control/musitu-financial-fabric/**'
      - 'docs/production-readiness/**'
      - '.github/workflows/musitu-financial-fabric-production-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MUSITU_POSTGRES_CI_IMAGE: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
  MUSITU_TIGERBEETLE_CI_IMAGE: ghcr.io/tigerbeetle/tigerbeetle@sha256:b140e2285fcc1ccd6a7a38a1e31ef13f98c3b511b29acc0a935d597546aa96ff

jobs:
  software-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: musitu_financial_fabric
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile production control plane
        run: python -m compileall -q app tests
      - name: Run complete test suite
        run: pytest -q
      - name: Prove live-funds gate cannot open without authorization evidence
        env:
          MUSITU_ENV: production
          MUSITU_LIVE_FUNDS_ENABLED: 'true'
          MUSITU_PRODUCTION_MODE: pilot
          MUSITU_METADATA_DB_URL: postgresql://user:pass@127.0.0.1/musitu
          MUSITU_LEDGER_BACKEND: tigerbeetle
          MUSITU_TIGERBEETLE_CLUSTER_ID: '1'
          MUSITU_TIGERBEETLE_ADDRESSES: 127.0.0.1:3000
          MUSITU_AUTH_INTROSPECTION_URL: https://identity.invalid/introspect
          MUSITU_AUTH_CLIENT_ID: musitu
          MUSITU_AUTH_CLIENT_SECRET: test-only
          MUSITU_AUTHZ_GATE_URL: https://authz.invalid/decision
          MUSITU_RISK_GATE_URL: https://risk.invalid/decision
          MUSITU_ECOCASH_WEBHOOK_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          python - <<'PY'
          from app.production import production_readiness
          result = production_readiness()
          assert result['ready_for_live_funds'] is False, result
          assert any(not row['ok'] and row['category'] == 'external' for row in result['checks'])
          print('PASS: external authorization evidence remains fail-closed')
          PY

  production-data-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: musitu_financial_fabric
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install application
        run: python -m pip install -e .
      - name: Start PostgreSQL
        run: docker run -d --name musitu-prod-postgres -e POSTGRES_PASSWORD=musitu-ci -p 5432:5432 "$MUSITU_POSTGRES_CI_IMAGE"
      - name: Verify PostgreSQL
        run: |
          for i in {1..60}; do docker exec musitu-prod-postgres pg_isready -U postgres && exit 0 || sleep 1; done
          docker logs musitu-prod-postgres
          exit 1
      - name: Start pinned TigerBeetle
        run: |
          mkdir -p "$RUNNER_TEMP/tb-prod"
          docker run --rm --security-opt seccomp=unconfined \
            -v "$RUNNER_TEMP/tb-prod:/data" "$MUSITU_TIGERBEETLE_CI_IMAGE" \
            format --cluster=1 --replica=0 --replica-count=1 /data/0_0.tigerbeetle
          docker run -d --name musitu-prod-tigerbeetle --security-opt seccomp=unconfined \
            -p 3000:3000 -v "$RUNNER_TEMP/tb-prod:/data" "$MUSITU_TIGERBEETLE_CI_IMAGE" \
            start --addresses=0.0.0.0:3000 --cache-grid=256MiB /data/0_0.tigerbeetle
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/3000) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs musitu-prod-tigerbeetle
          exit 1
      - name: Execute production metadata and monetary-truth path
        env:
          MUSITU_ENV: production
          MUSITU_LIVE_FUNDS_ENABLED: 'false'
          MUSITU_PRODUCTION_MODE: shadow
          MUSITU_METADATA_DB_URL: postgresql://postgres:musitu-ci@127.0.0.1:5432/postgres
          MUSITU_LEDGER_BACKEND: tigerbeetle
          MUSITU_TIGERBEETLE_CLUSTER_ID: '1'
          MUSITU_TIGERBEETLE_ADDRESSES: 127.0.0.1:3000
          MUSITU_AUTH_INTROSPECTION_URL: https://identity.invalid/introspect
          MUSITU_AUTH_CLIENT_ID: musitu
          MUSITU_AUTH_CLIENT_SECRET: test-only
          MUSITU_AUTHZ_GATE_URL: https://authz.invalid/decision
          MUSITU_RISK_GATE_URL: https://risk.invalid/decision
          MUSITU_ECOCASH_WEBHOOK_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          python - <<'PY'
          from app.production import enforce_safe_startup
          from app.db import init_db
          from app.ledger import balance, create_account, post
          from app.reconciliation import reconcile_monetary_truth

          enforce_safe_startup()
          init_db()
          source = create_account('system', 'ci-source', 'USD', 'rail_clearing')
          destination = create_account('merchant', 'ci-destination', 'USD', 'settlement')
          journal = post(
              reference='production-readiness-ci-transfer',
              memo='Production readiness TigerBeetle proof',
              postings=[(source['id'], -125), (destination['id'], 125)],
          )
          assert journal.startswith('jrnl_')
          assert balance(source['id']) == -125
          assert balance(destination['id']) == 125
          truth = reconcile_monetary_truth()
          assert truth['applicable'] is True, truth
          assert truth['consistent'] is True, truth
          assert truth['accounts_checked'] >= 2, truth
          print('PASS: PostgreSQL metadata + TigerBeetle monetary truth reconcile')
          PY
      - name: Prove cross-ledger divergence is detected fail-closed
        env:
          MUSITU_ENV: production
          MUSITU_LIVE_FUNDS_ENABLED: 'false'
          MUSITU_PRODUCTION_MODE: shadow
          MUSITU_METADATA_DB_URL: postgresql://postgres:musitu-ci@127.0.0.1:5432/postgres
          MUSITU_LEDGER_BACKEND: tigerbeetle
          MUSITU_TIGERBEETLE_CLUSTER_ID: '1'
          MUSITU_TIGERBEETLE_ADDRESSES: 127.0.0.1:3000
          MUSITU_AUTH_INTROSPECTION_URL: https://identity.invalid/introspect
          MUSITU_AUTH_CLIENT_ID: musitu
          MUSITU_AUTH_CLIENT_SECRET: test-only
          MUSITU_AUTHZ_GATE_URL: https://authz.invalid/decision
          MUSITU_RISK_GATE_URL: https://risk.invalid/decision
          MUSITU_ECOCASH_WEBHOOK_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          python - <<'PY'
          from app.db import connect
          from app.ledger import create_account
          from app.reconciliation import reconcile_monetary_truth

          source = create_account('system', 'ci-source', 'USD', 'rail_clearing')
          try:
              with connect() as conn:
                  conn.execute(
                      "UPDATE ledger_postings SET delta_minor=delta_minor-1 WHERE account_id=? AND journal_id=(SELECT id FROM journal_entries WHERE reference=?)",
                      (source['id'], 'production-readiness-ci-transfer'),
                  )
              drift = reconcile_monetary_truth()
              assert drift['consistent'] is False, drift
              assert any(row['account_id'] == source['id'] for row in drift['mismatches']), drift
              print('PASS: PostgreSQL/TigerBeetle divergence is detected')
          finally:
              with connect() as conn:
                  conn.execute(
                      "UPDATE ledger_postings SET delta_minor=delta_minor+1 WHERE account_id=? AND journal_id=(SELECT id FROM journal_entries WHERE reference=?)",
                      (source['id'], 'production-readiness-ci-transfer'),
                  )
          restored = reconcile_monetary_truth()
          assert restored['consistent'] is True, restored
          print('PASS: reconciliation returns green only after metadata mirror is repaired')
          PY
      - name: Prove PostgreSQL backup and restore
        run: |
          docker exec musitu-prod-postgres pg_dump -U postgres -Fc postgres > "$RUNNER_TEMP/musitu-postgres.dump"
          test -s "$RUNNER_TEMP/musitu-postgres.dump"
          docker exec musitu-prod-postgres createdb -U postgres musitu_restore
          cat "$RUNNER_TEMP/musitu-postgres.dump" | docker exec -i musitu-prod-postgres pg_restore -U postgres -d musitu_restore
          restored="$(docker exec musitu-prod-postgres psql -U postgres -d musitu_restore -Atc "SELECT COUNT(*) FROM journal_entries WHERE reference='production-readiness-ci-transfer';")"
          test "$restored" = "1"
      - name: Verify restored metadata audit chain
        env:
          MUSITU_ENV: production
          MUSITU_LIVE_FUNDS_ENABLED: 'false'
          MUSITU_PRODUCTION_MODE: shadow
          MUSITU_METADATA_DB_URL: postgresql://postgres:musitu-ci@127.0.0.1:5432/musitu_restore
          MUSITU_LEDGER_BACKEND: tigerbeetle
          MUSITU_TIGERBEETLE_CLUSTER_ID: '1'
          MUSITU_TIGERBEETLE_ADDRESSES: 127.0.0.1:3000
          MUSITU_AUTH_INTROSPECTION_URL: https://identity.invalid/introspect
          MUSITU_AUTH_CLIENT_ID: musitu
          MUSITU_AUTH_CLIENT_SECRET: test-only
          MUSITU_AUTHZ_GATE_URL: https://authz.invalid/decision
          MUSITU_RISK_GATE_URL: https://risk.invalid/decision
          MUSITU_ECOCASH_WEBHOOK_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          python - <<'PY'
          from app.audit import verify_audit_chain
          valid, count, broken_at = verify_audit_chain()
          assert valid, (count, broken_at)
          assert count > 0
          print('PASS: restored PostgreSQL audit chain verifies')
          PY
      - name: Prove TigerBeetle persistence across process restart
        env:
          MUSITU_ENV: production
          MUSITU_LIVE_FUNDS_ENABLED: 'false'
          MUSITU_PRODUCTION_MODE: shadow
          MUSITU_METADATA_DB_URL: postgresql://postgres:musitu-ci@127.0.0.1:5432/postgres
          MUSITU_LEDGER_BACKEND: tigerbeetle
          MUSITU_TIGERBEETLE_CLUSTER_ID: '1'
          MUSITU_TIGERBEETLE_ADDRESSES: 127.0.0.1:3000
          MUSITU_AUTH_INTROSPECTION_URL: https://identity.invalid/introspect
          MUSITU_AUTH_CLIENT_ID: musitu
          MUSITU_AUTH_CLIENT_SECRET: test-only
          MUSITU_AUTHZ_GATE_URL: https://authz.invalid/decision
          MUSITU_RISK_GATE_URL: https://risk.invalid/decision
          MUSITU_ECOCASH_WEBHOOK_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          docker stop musitu-prod-tigerbeetle
          docker rm musitu-prod-tigerbeetle
          docker run -d --name musitu-prod-tigerbeetle --security-opt seccomp=unconfined \
            -p 3000:3000 -v "$RUNNER_TEMP/tb-prod:/data" "$MUSITU_TIGERBEETLE_CI_IMAGE" \
            start --addresses=0.0.0.0:3000 --cache-grid=256MiB /data/0_0.tigerbeetle
          ready=0
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/3000) >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then docker logs musitu-prod-tigerbeetle; exit 1; fi
          python - <<'PY'
          from app.ledger import balance, create_account
          from app.reconciliation import reconcile_monetary_truth
          source = create_account('system', 'ci-source', 'USD', 'rail_clearing')
          destination = create_account('merchant', 'ci-destination', 'USD', 'settlement')
          assert balance(source['id']) == -125
          assert balance(destination['id']) == 125
          truth = reconcile_monetary_truth()
          assert truth['consistent'] is True, truth
          print('PASS: TigerBeetle monetary truth persisted and still reconciles after restart')
          PY
      - name: Capture failure diagnostics
        if: failure()
        run: |
          docker ps -a || true
          docker logs musitu-prod-postgres || true
          docker logs musitu-prod-tigerbeetle || true

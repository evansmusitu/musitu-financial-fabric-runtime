name: MUSITU Financial Fabric — Target Evidence Hardening Publisher

on:
  push:
    branches: [musitu-financial-fabric-production-readiness]
    paths:
      - '.github/workflows/mff-target-evidence-hardening-publisher.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish-reviewed-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact publication base and payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "80e4df92a9727e79485fbe6430be8344a184e583"
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/initial-files.txt"
          printf '%s\n' \
            '.github/mff-target-evidence-hardening.patch.gz.b64' \
            '.github/workflows/mff-target-evidence-hardening-publisher.yml' | sort > "$RUNNER_TEMP/expected-initial.txt"
          diff -u "$RUNNER_TEMP/expected-initial.txt" "$RUNNER_TEMP/initial-files.txt"
          echo '59c17b90e568cc5fd723974a33031ae0152d27ed87342c83e2b583e323adb35d  .github/mff-target-evidence-hardening.patch.gz.b64' | sha256sum -c -
          base64 --decode .github/mff-target-evidence-hardening.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/mff.patch"
          echo 'd2abfc9a363b3a988c6b1298edc24bf70a7de973b956b8cbba6510e7bae4d0bd  '"$RUNNER_TEMP/mff.patch" | sha256sum -c -

      - name: Apply reviewed hardening and stage exact product mutation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/mff.patch"
          git apply "$RUNNER_TEMP/mff.patch"
          git rm .github/mff-target-evidence-hardening.patch.gz.b64
          git rm .github/workflows/mff-target-evidence-hardening-publisher.yml
          git add -u
          git add control/musitu-financial-fabric/production-deployment-evidence-manifest.example.json
          git diff --cached --check
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged-files.txt"
          printf '%s\n' \
            '.github/mff-target-evidence-hardening.patch.gz.b64' \
            '.github/workflows/mff-production-image.yml' \
            '.github/workflows/mff-target-evidence-hardening-publisher.yml' \
            '.github/workflows/musitu-financial-fabric-core.yml' \
            '.github/workflows/musitu-financial-fabric-production-iac.yml' \
            'control/musitu-financial-fabric/production-deployment-evidence-manifest.example.json' \
            'deploy/musitu-financial-fabric/Dockerfile' \
            'docs/production-readiness/ACTIVATION_RUNBOOK.md' \
            'docs/production-readiness/CONTROL_MATRIX.md' \
            'docs/production-readiness/README.md' \
            'musitu_financial_fabric/app/config.py' \
            'musitu_financial_fabric/app/production.py' \
            'musitu_financial_fabric/infra/production_guard.tf' \
            'musitu_financial_fabric/tests/test_production_controls.py' | sort > "$RUNNER_TEMP/expected-staged.txt"
          sort -o "$RUNNER_TEMP/expected-staged.txt" "$RUNNER_TEMP/expected-staged.txt"
          diff -u "$RUNNER_TEMP/expected-staged.txt" "$RUNNER_TEMP/staged-files.txt"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            musitu_financial_fabric/pyproject.toml
            musitu_financial_fabric/constraints-ci.txt

      - name: Verify evidence-locked product suite
        shell: bash
        working-directory: musitu_financial_fabric
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -c constraints-ci.txt -e '.[dev]'
          python -m pip check
          python -m compileall -q app scripts tests
          pytest -q

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1

      - name: Verify production IaC guard
        shell: bash
        working-directory: musitu_financial_fabric
        run: |
          set -euo pipefail
          tofu -chdir=infra init -backend=false
          tofu -chdir=infra validate

      - name: Commit and fast-forward authoritative branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin musitu-financial-fabric-production-readiness
          test "$(git rev-parse origin/musitu-financial-fabric-production-readiness)" = "${{ github.sha }}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bind live-funds gate to target deployment evidence'
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/musitu-financial-fabric-production-readiness
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head evidence workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in \
            musitu-financial-fabric-core.yml \
            mff-production-image.yml \
            mff-production-resilience.yml \
            musitu-financial-fabric-compliance-billing.yml \
            musitu-financial-fabric-foundation.yml \
            musitu-financial-fabric-gazelle.yml \
            musitu-financial-fabric-hyperswitch.yml \
            musitu-financial-fabric-identity-security.yml \
            musitu-financial-fabric-interop.yml \
            musitu-financial-fabric-production-iac.yml \
            musitu-financial-fabric-production-readiness.yml \
            musitu-financial-fabric-runtime-secondary.yml; do
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${{ github.repository }}/actions/workflows/$workflow/dispatches" \
              -f ref='musitu-financial-fabric-production-readiness'
          done

      - name: Verify published branch identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api "/repos/${{ github.repository }}/branches/musitu-financial-fabric-production-readiness" --jq .commit.sha)"
          test "$actual" = "${{ steps.publish.outputs.final_sha }}"
          echo "Published final SHA: $actual"

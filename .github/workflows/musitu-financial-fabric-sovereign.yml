name: MUSITU Financial Fabric — Sovereign Payments Phase 1

on:
  pull_request:
    paths:
      - 'musitu_financial_fabric/app/sovereign.py'
      - 'musitu_financial_fabric/app/db.py'
      - 'musitu_financial_fabric/app/main.py'
      - 'musitu_financial_fabric/app/component_registry.py'
      - 'musitu_financial_fabric/tests/test_sovereign_*.py'
      - '.github/workflows/musitu-financial-fabric-sovereign.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: musitu_financial_fabric
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile changed Python without dependency installation
        run: python3 -m py_compile app/db.py app/sovereign.py app/main.py tests/test_sovereign_directory.py tests/test_sovereign_qr.py tests/test_sovereign_request_to_pay.py tests/test_sovereign_isolation.py tests/test_sovereign_postgres_idempotency.py tests/test_sovereign_zimbabwe_profile.py

  isolation-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm production rail and registry isolation
        run: |
          grep -F '_PRODUCTION_IMPLEMENTED_RAILS = {"ecocash"}' musitu_financial_fabric/app/production.py
          ! grep -F '"sovereign":' musitu_financial_fabric/app/service.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('musitu_financial_fabric/app/component_registry.py').read_text()
          start = source.index('COMPONENTS: tuple[Component, ...] = (')
          end = source.index('\n\n\ndef component_manifest', start)
          block = source[start:end]
          count = block.count('    Component(')
          assert count == 39, count
          print('required-component-declarations=39')
          PY

  compile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: musitu_financial_fabric
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: |
            musitu_financial_fabric/pyproject.toml
            musitu_financial_fabric/constraints-ci.txt
      - name: Install evidence-locked dependencies
        run: python -m pip install -U pip && python -m pip install -c constraints-ci.txt -e '.[dev]' && python -m pip check
      - name: Compile sovereign slice
        run: python -m compileall -q app tests/test_sovereign_directory.py

  directory:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: musitu_financial_fabric
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: |
            musitu_financial_fabric/pyproject.toml
            musitu_financial_fabric/constraints-ci.txt
      - name: Install evidence-locked dependencies
        run: python -m pip install -U pip && python -m pip install -c constraints-ci.txt -e '.[dev]' && python -m pip check
      - name: Sovereign payments focused tests
        run: pytest -q tests/test_sovereign_*.py

  regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: musitu_financial_fabric
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: |
            musitu_financial_fabric/pyproject.toml
            musitu_financial_fabric/constraints-ci.txt
      - name: Install evidence-locked dependencies
        run: python -m pip install -U pip && python -m pip install -c constraints-ci.txt -e '.[dev]' && python -m pip check
      - name: Existing smoke regression
        run: pytest -q tests/test_smoke.py tests/test_merchant_lifecycle.py


  fallback-ubuntu22:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: musitu_financial_fabric
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: |
            musitu_financial_fabric/pyproject.toml
            musitu_financial_fabric/constraints-ci.txt
      - name: Install evidence-locked dependencies
        run: python -m pip install -U pip && python -m pip install -c constraints-ci.txt -e '.[dev]' && python -m pip check
      - name: Compile and run isolated sovereign suite
        run: |
          python -m compileall -q app tests/test_sovereign_*.py
          pytest -q tests/test_sovereign_*.py

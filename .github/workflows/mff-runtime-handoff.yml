name: MFF runtime snapshot handoff
on:
  push:
    branches:
      - 'handoff/mff-runtime-snapshot-20261004-0824cat'
permissions:
  contents: write
jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and commit exact snapshot payload
        env:
          AUTH_SHA: a80ce52c3b8fcef3e6cece76103417236bcb0c4c
          SNAP_NAME: MFF_RUNTIME_a80ce52c3b8fcef3e6cece76103417236bcb0c4c.tar.gz
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/snapshot"
          mkdir -p "$RUNNER_TEMP/snapshot" handoff_payload
          git archive "$AUTH_SHA" | tar -xf - -C "$RUNNER_TEMP/snapshot"
          (
            cd "$RUNNER_TEMP/snapshot"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SNAPSHOT_MANIFEST.sha256
            sha256sum -c SNAPSHOT_MANIFEST.sha256
          )
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$SNAP_NAME" snapshot
          sha256sum "$RUNNER_TEMP/$SNAP_NAME" > "handoff_payload/$SNAP_NAME.sha256"
          base64 -w0 "$RUNNER_TEMP/$SNAP_NAME" > "handoff_payload/$SNAP_NAME.b64"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add handoff_payload
          git commit -m "Store isolated runtime snapshot payload"
          git push

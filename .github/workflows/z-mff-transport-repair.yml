name: MFF exact-byte transport repair

on:
  push:
    branches: [musitu-financial-fabric-production-readiness]
    paths:
      - '.github/workflows/z-mff-transport-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.6

      - name: Reconstruct and validate pristine transport bytes
        shell: bash
        run: |
          set -euo pipefail
          carrier_commit=9be61c9995d6aa293180331728d7505cbbc76f86
          git cat-file -e "$carrier_commit^{commit}"
          git show "$carrier_commit:.mff-staging/production_guard.tf.b64" | base64 -d > "$RUNNER_TEMP/expected-production-guard.tf"
          git show "$carrier_commit:.mff-staging/production-iac.yml.b64" | base64 -d > "$RUNNER_TEMP/expected-production-iac.yml"
          test "$(git hash-object "$RUNNER_TEMP/expected-production-guard.tf")" = "523ae44191327d39e39b19f506e9d92a582ad87f"
          test "$(git hash-object "$RUNNER_TEMP/expected-production-iac.yml")" = "51174639117b4ece27c59e834fcd31e9abe707d6"
          mkdir -p .mff-repair
          cp "$RUNNER_TEMP/expected-production-iac.yml" .mff-repair/production-iac.yml
          cp "$RUNNER_TEMP/expected-production-guard.tf" musitu_financial_fabric/infra/production_guard.tf
          tofu -chdir=musitu_financial_fabric/infra init -backend=false
          tofu -chdir=musitu_financial_fabric/infra validate
          git diff --check

      - name: Publish pristine IaC and stage workflow blob
        shell: bash
        run: |
          set -euo pipefail
          git add musitu_financial_fabric/infra/production_guard.tf .mff-repair/production-iac.yml
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' '.mff-repair/production-iac.yml' 'musitu_financial_fabric/infra/production_guard.tf' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test "$(git hash-object musitu_financial_fabric/infra/production_guard.tf)" = "523ae44191327d39e39b19f506e9d92a582ad87f"
          test "$(git hash-object .mff-repair/production-iac.yml)" = "51174639117b4ece27c59e834fcd31e9abe707d6"
          git fetch origin musitu-financial-fabric-production-readiness
          test "$(git rev-parse origin/musitu-financial-fabric-production-readiness)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage pristine Production IaC transport bytes'
          git push origin HEAD:refs/heads/musitu-financial-fabric-production-readiness

name: MFF exact-byte transport repair

on:
  push:
    branches: [musitu-financial-fabric-production-readiness]
    paths:
      - '.github/workflows/z-mff-transport-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.6

      - name: Reconstruct exact tested transport bytes
        shell: bash
        run: |
          set -euo pipefail
          carrier_commit=9be61c9995d6aa293180331728d7505cbbc76f86
          git cat-file -e "$carrier_commit^{commit}"
          git show "$carrier_commit:.mff-staging/production_guard.tf.b64" | base64 -d > "$RUNNER_TEMP/expected-production-guard.tf"
          git show "$carrier_commit:.mff-staging/production-iac.yml.b64" | base64 -d > "$RUNNER_TEMP/expected-production-iac.yml"

          echo "expected IaC blob:    $(git hash-object "$RUNNER_TEMP/expected-production-guard.tf")"
          echo "installed IaC blob:   $(git hash-object musitu_financial_fabric/infra/production_guard.tf)"
          echo "expected workflow:    $(git hash-object "$RUNNER_TEMP/expected-production-iac.yml")"
          echo "installed workflow:   $(git hash-object .github/workflows/musitu-financial-fabric-production-iac.yml)"

          if ! cmp -s "$RUNNER_TEMP/expected-production-iac.yml" .github/workflows/musitu-financial-fabric-production-iac.yml; then
            echo 'FAIL: installed Production IaC workflow is not byte-identical to the tested carrier.'
            diff -u .github/workflows/musitu-financial-fabric-production-iac.yml "$RUNNER_TEMP/expected-production-iac.yml" || true
            exit 1
          fi

          cp "$RUNNER_TEMP/expected-production-guard.tf" musitu_financial_fabric/infra/production_guard.tf
          test "$(git hash-object musitu_financial_fabric/infra/production_guard.tf)" = "$(git hash-object "$RUNNER_TEMP/expected-production-guard.tf")"
          tofu -chdir=musitu_financial_fabric/infra init -backend=false
          tofu -chdir=musitu_financial_fabric/infra validate

      - name: Publish exact tested IaC bytes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = 'musitu_financial_fabric/infra/production_guard.tf'
          git fetch origin musitu-financial-fabric-production-readiness
          test "$(git rev-parse origin/musitu-financial-fabric-production-readiness)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add musitu_financial_fabric/infra/production_guard.tf
          git commit -m 'Restore exact tested production IaC bytes'
          git push origin HEAD:refs/heads/musitu-financial-fabric-production-readiness

name: Temporary merchant dispatch lock patch

on:
  push:
    branches: [tmp-mff-merchant-dispatch-lock-20260911]
    paths:
      - '.github/workflows/tmp-merchant-dispatch-lock-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-exact-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp-mff-merchant-dispatch-lock-20260911
          fetch-depth: 1
      - name: Apply exact merchant dispatch claim guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('musitu_financial_fabric/app/service.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _persist_production_dispatch(')
          needle = '''        try:\n            conn.execute(\n                """INSERT INTO payment_intents'''
          pos = text.index(needle, start)
          guard = '''        try:\n            lock_suffix = " FOR UPDATE" if settings.uses_postgres else ""\n            merchant = conn.execute(\n                "SELECT status FROM merchants WHERE id=?" + lock_suffix,\n                (merchant_id,),\n            ).fetchone()\n            if not merchant or merchant["status"] != "active":\n                raise PaymentError("merchant is not active at production dispatch claim")\n            conn.execute(\n                """INSERT INTO payment_intents'''
          if 'merchant is not active at production dispatch claim' in text[start:]:
              raise SystemExit('guard already present')
          updated = text[:pos] + guard + text[pos + len(needle):]
          path.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          git diff -- musitu_financial_fabric/app/service.py
          git config user.name 'musitu-ci-patch'
          git config user.email 'musitu-ci-patch@users.noreply.github.com'
          git add musitu_financial_fabric/app/service.py
          git commit -m 'Lock merchant state at production dispatch claim'
          git push origin HEAD:tmp-mff-merchant-dispatch-lock-20260911

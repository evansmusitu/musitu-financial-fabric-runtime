name: MUSITU Financial Fabric — Interoperability Runtimes

on:
  push:
    branches: [musitu-financial-fabric, musitu-financial-fabric-production-readiness]
    paths:
      - 'control/musitu-financial-fabric/**'
      - '.github/workflows/musitu-financial-fabric-interop.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARD_VAULT_UPSTREAM_SHA: 132ac81cfe8a87934643cc4069dd015b7b114a1d
  RAFIKI_UPSTREAM_SHA: b3387c66ee9b991e2f4b9f04ef57e9c86b9313c8
  STELLAR_ANCHOR_UPSTREAM_SHA: 129d0acdab20758c37e9869e84d64373b6b928aa
  MUSITU_POSTGRES_CI_IMAGE: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
  MUSITU_REDIS_CI_IMAGE: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
  CARD_VAULT_RUST_BASE: rust@sha256:3b05f7c617a200c41c3506097f0d15fc193a1c93bfd8f141007b47cac8f95d3c
  CARD_VAULT_DEBIAN_BASE: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132

jobs:
  card-vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Acquire exact official Hyperswitch Card Vault revision
        run: |
          git init /tmp/card-vault
          git -C /tmp/card-vault remote add origin https://github.com/juspay/hyperswitch-card-vault.git
          git -C /tmp/card-vault fetch --depth 1 origin "$CARD_VAULT_UPSTREAM_SHA"
          git -C /tmp/card-vault checkout --detach FETCH_HEAD
          test "$(git -C /tmp/card-vault rev-parse HEAD)" = "$CARD_VAULT_UPSTREAM_SHA"
      - name: Record upstream revision
        run: git -C /tmp/card-vault rev-parse HEAD | tee /tmp/card-vault.sha
      - name: Pin Card Vault build bases to immutable digests
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('/tmp/card-vault/Dockerfile')
          text = path.read_text()
          replacements = {
              'FROM rust:slim-trixie AS builder': f"FROM {os.environ['CARD_VAULT_RUST_BASE']} AS builder",
              'FROM debian:trixie-slim': f"FROM {os.environ['CARD_VAULT_DEBIAN_BASE']}",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Card Vault Dockerfile signature changed: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Start database and Redis
        run: |
          docker run -d --name musitu-vault-pg -e POSTGRES_USER=db_user -e POSTGRES_PASSWORD=db_pass -e POSTGRES_DB=locker -p 5432:5432 "$MUSITU_POSTGRES_CI_IMAGE"
          docker run -d --name musitu-vault-redis -p 6379:6379 "$MUSITU_REDIS_CI_IMAGE"
          for i in {1..60}; do docker exec musitu-vault-pg pg_isready -U db_user -d locker && break || sleep 1; done
          docker exec musitu-vault-redis redis-cli ping | grep -q PONG
      - name: Apply Card Vault migrations
        run: |
          for f in /tmp/card-vault/migrations/*/up.sql; do
            docker exec -i musitu-vault-pg psql -v ON_ERROR_STOP=1 -U db_user -d locker < "$f"
          done
      - name: Build official Card Vault release image from pinned bases
        working-directory: /tmp/card-vault
        run: docker build --build-arg DEV=false -t musitu-card-vault:ci .
      - name: Start Card Vault
        run: |
          docker run -d --name musitu-card-vault --network host \
            -v /tmp/card-vault/config/development.toml:/local/config/production.toml:ro \
            -e LOCKER__SERVER__HOST=0.0.0.0 \
            -e LOCKER__SERVER__PORT=3001 \
            musitu-card-vault:ci
      - name: Verify Card Vault health
        run: |
          ok=0
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3001/health >/tmp/card-vault-health.json; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            docker ps -a --filter name=musitu-card-vault
            docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} finished={{.State.FinishedAt}}' musitu-card-vault || true
            docker logs musitu-card-vault 2>&1 | tee /tmp/card-vault-container.log || true
            exit 1
          fi
          cat /tmp/card-vault-health.json
          grep -qi 'health is good' /tmp/card-vault-health.json
      - name: Capture image identities
        if: always()
        run: |
          docker image inspect "$MUSITU_POSTGRES_CI_IMAGE" --format '{{json .RepoDigests}}' | tee /tmp/card-vault-postgres-digests.txt || true
          docker image inspect "$MUSITU_REDIS_CI_IMAGE" --format '{{json .RepoDigests}}' | tee /tmp/card-vault-redis-digests.txt || true
          docker image inspect musitu-card-vault:ci --format 'id={{.Id}}' | tee /tmp/card-vault-built-image.txt || true
      - name: Upload evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musitu-card-vault-evidence
          path: |
            /tmp/card-vault.sha
            /tmp/card-vault-health.json
            /tmp/card-vault-container.log
            /tmp/card-vault-postgres-digests.txt
            /tmp/card-vault-redis-digests.txt
            /tmp/card-vault-built-image.txt

  rafiki:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Acquire exact official Rafiki revision with submodules
        run: |
          git init /tmp/rafiki
          git -C /tmp/rafiki remote add origin https://github.com/interledger/rafiki.git
          git -C /tmp/rafiki fetch --depth 1 origin "$RAFIKI_UPSTREAM_SHA"
          git -C /tmp/rafiki checkout --detach FETCH_HEAD
          test "$(git -C /tmp/rafiki rev-parse HEAD)" = "$RAFIKI_UPSTREAM_SHA"
          git -C /tmp/rafiki submodule update --init --recursive --depth 1
      - name: Record upstream revision
        run: git -C /tmp/rafiki rev-parse HEAD | tee /tmp/rafiki.sha
      - name: Install exact Rafiki workspace dependencies
        working-directory: /tmp/rafiki
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - name: Launch official two-ASE Open Payments playground
        working-directory: /tmp/rafiki
        run: |
          set +e
          pnpm localenv:compose up -d
          rc=$?
          set -e
          pnpm localenv:compose ps -a | tee /tmp/rafiki-compose-ps.txt || true
          docker inspect rafiki-cloud-nine-backend-1 > /tmp/rafiki-cloud-nine-backend-inspect.json 2>/dev/null || true
          docker logs rafiki-cloud-nine-backend-1 > /tmp/rafiki-cloud-nine-backend.log 2>&1 || true
          if [ "$rc" -ne 0 ]; then
            cat /tmp/rafiki-compose-ps.txt || true
            docker inspect -f '{{json .State.Health}}' rafiki-cloud-nine-backend-1 || true
            cat /tmp/rafiki-cloud-nine-backend.log || true
            exit "$rc"
          fi
      - name: Verify both Open Payments instances and auth endpoints
        run: |
          for port in 3000 3006 4000 4006; do
            ok=0
            for i in {1..150}; do
              code=$(curl -sS -o /tmp/rafiki-$port.out -w '%{http_code}' http://127.0.0.1:$port/ || true)
              if [ "$code" != 000 ]; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          done
          docker ps --format '{{.Names}} {{.Status}}' | tee /tmp/rafiki-containers.txt
          test "$(grep -ci rafiki /tmp/rafiki-containers.txt)" -gt 0
      - name: Capture resolved runtime image identities
        if: always()
        run: |
          docker ps -a --format '{{.Image}}' | sort -u | while read -r image; do
            [ -n "$image" ] || continue
            printf '%s ' "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}' || true
          done | tee /tmp/rafiki-image-digests.txt
      - name: Upload evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musitu-rafiki-evidence
          path: |
            /tmp/rafiki.sha
            /tmp/rafiki-containers.txt
            /tmp/rafiki-compose-ps.txt
            /tmp/rafiki-cloud-nine-backend-inspect.json
            /tmp/rafiki-cloud-nine-backend.log
            /tmp/rafiki-image-digests.txt

  stellar-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Acquire exact official Stellar Anchor Platform revision
        run: |
          git init /tmp/anchor-platform
          git -C /tmp/anchor-platform remote add origin https://github.com/stellar/anchor-platform.git
          git -C /tmp/anchor-platform fetch --depth 1 origin "$STELLAR_ANCHOR_UPSTREAM_SHA"
          git -C /tmp/anchor-platform checkout --detach FETCH_HEAD
          test "$(git -C /tmp/anchor-platform rev-parse HEAD)" = "$STELLAR_ANCHOR_UPSTREAM_SHA"
      - name: Record upstream revision
        run: git -C /tmp/anchor-platform rev-parse HEAD | tee /tmp/stellar-anchor.sha
      - name: Install pinned Stellar CLI
        run: |
          curl -fsSL -o /tmp/stellar-cli.deb https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli_28.0.0_amd64.deb
          echo '77d6b67b6f9ab8f04563615ae2e7636a3be9d1de762ed7f8790dbfde24c9e055  /tmp/stellar-cli.deb' | sha256sum -c -
          sudo dpkg -i /tmp/stellar-cli.deb
          stellar --version
      - name: Launch official quick-run bootstrap without exposing testnet secrets
        working-directory: /tmp/anchor-platform/quick-run
        run: |
          set +e
          bash ./ap_start.sh >/tmp/stellar-bootstrap.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - <<'PY'
          import re
          from pathlib import Path
          s = Path('/tmp/stellar-bootstrap.log').read_text(errors='replace')
          s = re.sub(r'\bS[A-Z2-7]{55}\b', '<redacted-stellar-secret>', s)
          print(s)
          PY
            exit "$rc"
          fi
      - name: Verify SEP server and Stellar TOML
        working-directory: /tmp/anchor-platform/quick-run
        run: |
          for i in {1..150}; do curl -fsS http://127.0.0.1:8080/.well-known/stellar.toml >/tmp/stellar.toml && break || sleep 2; done
          test -s /tmp/stellar.toml
          grep -Eq 'NETWORK_PASSPHRASE|SIGNING_KEY|TRANSFER_SERVER' /tmp/stellar.toml
          docker compose ps | tee /tmp/stellar-containers.txt
          docker compose ps --status running platform | grep -q platform
      - name: Capture resolved runtime image identities
        if: always()
        run: |
          docker ps -a --format '{{.Image}}' | sort -u | while read -r image; do
            [ -n "$image" ] || continue
            printf '%s ' "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}' || true
          done | tee /tmp/stellar-image-digests.txt
      - name: Upload evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musitu-stellar-anchor-evidence
          path: |
            /tmp/stellar-anchor.sha
            /tmp/stellar.toml
            /tmp/stellar-containers.txt
            /tmp/stellar-image-digests.txt

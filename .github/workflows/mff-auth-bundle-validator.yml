name: MUSITU Financial Fabric — Authorization Bundle Hardening Validator

on:
  push:
    branches: [musitu-financial-fabric-production-readiness]
    paths:
      - '.github/mff-auth-bundle-hardening.py'
      - '.github/workflows/mff-auth-bundle-validator.yml'

permissions:
  contents: write

jobs:
  validate-and-publish-runtime-half:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify exact authority and hardening script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9c1e2e491991a39608459b576a752462fa004673"
          echo 'd3fc187dc6b51a21b761fd2197a5648746f8487858a8bd34a2b3bea33533a004  .github/mff-auth-bundle-hardening.py' | sha256sum -c -

      - name: Apply exact-match authorization bundle hardening
        shell: bash
        run: |
          set -euo pipefail
          python .github/mff-auth-bundle-hardening.py
          git diff --check
          git diff --name-only | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/musitu-financial-fabric-production-iac.yml' \
            'control/musitu-financial-fabric/production-authorization-manifest.example.json' \
            'docs/production-readiness/ACTIVATION_RUNBOOK.md' \
            'docs/production-readiness/CONTROL_MATRIX.md' \
            'docs/production-readiness/README.md' \
            'musitu_financial_fabric/app/production.py' \
            'musitu_financial_fabric/infra/production_guard.tf' \
            'musitu_financial_fabric/tests/test_production_controls.py' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            musitu_financial_fabric/pyproject.toml
            musitu_financial_fabric/constraints-ci.txt

      - name: Verify full evidence-locked Python suite
        working-directory: musitu_financial_fabric
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -c constraints-ci.txt -e '.[dev]'
          python -m pip check
          python -m compileall -q app scripts tests
          pytest -q

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.6

      - name: Verify IaC authorization bundle gate
        shell: bash
        run: |
          set -euo pipefail
          tofu -chdir=musitu_financial_fabric/infra init -backend=false
          tofu -chdir=musitu_financial_fabric/infra validate

          auth_bundle="$RUNNER_TEMP/auth-bundle.bin"
          target_bundle="$RUNNER_TEMP/target-bundle.bin"
          printf '%s' 'AUTH-EVIDENCE' > "$auth_bundle"
          printf '%s' 'TARGET-EVIDENCE' > "$target_bundle"
          auth_bundle_sha="$(sha256sum "$auth_bundle" | awk '{print $1}')"
          target_bundle_sha="$(sha256sum "$target_bundle" | awk '{print $1}')"
          auth_manifest="$RUNNER_TEMP/auth.json"
          deployment="$RUNNER_TEMP/deployment.json"
          release_commit='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          release_image='sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          rollback_image='sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc'

          python - "$auth_manifest" "$auth_bundle" "$auth_bundle_sha" <<'PY'
          import json, sys
          path, bundle_path, bundle_sha = sys.argv[1:]
          data = {
              'funds_scope': 'pilot',
              'expires_at': '2099-01-01T00:00:00Z',
              'evidence_bundle': {'path': bundle_path, 'sha256': bundle_sha},
              'launch_scope': {'rails': ['ecocash'], 'currencies': ['USD'], 'max_single_payment_minor': 1000},
              'evidence': {
                  'regulator': {'status': 'approved', 'evidence_ref': 'TEST-REGULATOR'},
                  'sponsor_bank': {'status': 'approved', 'evidence_ref': 'TEST-BANK'},
                  'data_protection': {'status': 'approved', 'evidence_ref': 'TEST-DATA'},
                  'independent_security': {'status': 'approved', 'evidence_ref': 'TEST-SECURITY'},
                  'rail_provider': {'status': 'approved', 'evidence_ref': 'TEST-RAIL'},
              },
          }
          with open(path, 'w', encoding='utf-8') as f: json.dump(data, f, sort_keys=True)
          PY
          auth_sha="$(sha256sum "$auth_manifest" | awk '{print $1}')"

          python - "$deployment" "$target_bundle" "$target_bundle_sha" "$auth_sha" "$release_commit" "$release_image" "$rollback_image" <<'PY'
          import json, sys
          path, bundle_path, bundle_sha, auth_sha, commit, image, rollback = sys.argv[1:]
          data = {
              'target_environment_id': 'test-only-production-target',
              'verified_at': '2026-01-01T00:00:00Z',
              'expires_at': '2099-01-01T00:00:00Z',
              'evidence_bundle': {'path': bundle_path, 'sha256': bundle_sha},
              'release': {'commit_sha': commit, 'image_digest': image, 'rollback_image_digest': rollback, 'authorization_manifest_sha256': auth_sha},
              'evidence': {k: {'status': 'passed', 'evidence_ref': 'TEST-'+k} for k in ['dark_deployment','monitoring_alerting','postgres_backup_restore','tigerbeetle_recovery','provider_reconciliation','activation_rollback_drill']},
              'independent_kill_controls': {k: {'status': 'verified', 'independent_of_application': True, 'evidence_ref': 'TEST-'+k} for k in ['network','provider','settlement']},
          }
          with open(path, 'w', encoding='utf-8') as f: json.dump(data, f, sort_keys=True)
          PY
          deployment_sha="$(sha256sum "$deployment" | awk '{print $1}')"

          common=(
            -var='environment=production'
            -var='production_mode=pilot'
            -var='live_funds_enabled=true'
            -var="authorization_manifest_path=$auth_manifest"
            -var="authorization_manifest_sha256=$auth_sha"
            -var="deployment_evidence_manifest_path=$deployment"
            -var="deployment_evidence_manifest_sha256=$deployment_sha"
            -var="release_commit=$release_commit"
            -var="release_image_digest=$release_image"
            -var='production_enabled_rails=["ecocash"]'
            -var='production_enabled_currencies=["USD"]'
            -var='max_single_payment_minor=1000'
          )
          tofu -chdir=musitu_financial_fabric/infra plan -input=false -lock=false -refresh=false "${common[@]}" > "$RUNNER_TEMP/valid.log"
          printf '%s' '-TAMPERED' >> "$auth_bundle"
          if tofu -chdir=musitu_financial_fabric/infra plan -input=false -lock=false -refresh=false "${common[@]}" > "$RUNNER_TEMP/tampered.log" 2>&1; then
            echo 'FAIL: tampered authorization evidence bundle was accepted'
            exit 1
          fi
          grep -q 'authorization evidence bundle' "$RUNNER_TEMP/tampered.log"

      - name: Publish runtime half and stage exact IaC bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mff-staging
          base64 -w0 musitu_financial_fabric/infra/production_guard.tf > .mff-staging/production_guard.tf.b64
          base64 -w0 .github/workflows/musitu-financial-fabric-production-iac.yml > .mff-staging/production-iac.yml.b64
          git checkout HEAD -- musitu_financial_fabric/infra/production_guard.tf .github/workflows/musitu-financial-fabric-production-iac.yml
          git add \
            musitu_financial_fabric/app/production.py \
            musitu_financial_fabric/tests/test_production_controls.py \
            control/musitu-financial-fabric/production-authorization-manifest.example.json \
            docs/production-readiness/ACTIVATION_RUNBOOK.md \
            docs/production-readiness/CONTROL_MATRIX.md \
            docs/production-readiness/README.md \
            .mff-staging/production_guard.tf.b64 \
            .mff-staging/production-iac.yml.b64
          git diff --cached --check
          git fetch origin musitu-financial-fabric-production-readiness
          test "$(git rev-parse origin/musitu-financial-fabric-production-readiness)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bind external authorization to retained evidence bundle'
          git push origin HEAD:refs/heads/musitu-financial-fabric-production-readiness

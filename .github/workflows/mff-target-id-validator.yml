name: MFF Target Identity Hardening Validator

on:
  push:
    branches: [musitu-financial-fabric-production-readiness]
    paths:
      - '.github/mff-target-id-hardening.py'
      - '.github/workflows/mff-target-id-validator.yml'

permissions:
  contents: write

jobs:
  validate-and-publish-runtime-half:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
      - name: Verify exact authority and hardening script
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '0a128be89272fa8933386182eecdf206a2a9c246'
          test "$(git rev-parse HEAD^^)" = 'b8d51253f2af9afdbfc56d51efb536c6a9919b4f'
          test "$(git rev-parse HEAD^^^)" = 'c645d3a204d9de891315230f3a23a43730677bb9'
          test "$(git hash-object .github/mff-target-id-hardening.py)" = '3546fea404d8be7dece8afe9446c120fbe71e3f9'
          echo 'd89f2951a2f76cc1fa725e352fcec873af84ec7848c7dcde90b00a02e8de5044  .github/mff-target-id-hardening.py' | sha256sum -c -
      - name: Apply exact target-identity hardening
        run: |
          set -euo pipefail
          set +e
          patch_output="$(python .github/mff-target-id-hardening.py 2>&1)"
          patch_status=$?
          set -e
          test "$patch_status" -eq 1
          test "$patch_output" = 'docs/production-readiness/CONTROL_MATRIX.md: expected exactly one match, found 0'
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/production-readiness/CONTROL_MATRIX.md')
          text = p.read_text()
          old = '| Target activation evidence | Live-funds readiness also requires'
          new = '| Target identity binding | Deployment manifest target ID must exactly equal independently configured `MUSITU_TARGET_ENVIRONMENT_ID`; missing or mismatched identity closes live funds |\n' + old
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))
          PY
          expected=$'.github/workflows/musitu-financial-fabric-production-iac.yml\ndocs/production-readiness/ACTIVATION_RUNBOOK.md\ndocs/production-readiness/CONTROL_MATRIX.md\nmusitu_financial_fabric/app/config.py\nmusitu_financial_fabric/app/production.py\nmusitu_financial_fabric/infra/production_guard.tf\nmusitu_financial_fabric/tests/test_production_controls.py'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected" || { echo "Unexpected mutation set:"; printf '%s\n' "$actual"; exit 1; }
          grep -q 'MUSITU_TARGET_ENVIRONMENT_ID' musitu_financial_fabric/app/config.py
          grep -q 'wrong-production-target' musitu_financial_fabric/tests/test_production_controls.py
          grep -q 'wrong production target identity was accepted' .github/workflows/musitu-financial-fabric-production-iac.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Run evidence-locked Python suite
        working-directory: musitu_financial_fabric
        run: |
          set -euo pipefail
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check
          python -m compileall -q app tests
          pytest -q
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
      - name: Validate modified production IaC
        working-directory: musitu_financial_fabric
        run: |
          set -euo pipefail
          tofu -chdir=infra init -backend=false
          tofu -chdir=infra validate
      - name: Stage already-validated workflow and IaC bytes, then publish runtime half
        run: |
          set -euo pipefail
          mkdir -p .mff-target-id
          base64 -w0 musitu_financial_fabric/infra/production_guard.tf > .mff-target-id/production_guard.tf.b64
          base64 -w0 .github/workflows/musitu-financial-fabric-production-iac.yml > .mff-target-id/production-iac.yml.b64
          git checkout -- musitu_financial_fabric/infra/production_guard.tf .github/workflows/musitu-financial-fabric-production-iac.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            musitu_financial_fabric/app/config.py \
            musitu_financial_fabric/app/production.py \
            musitu_financial_fabric/tests/test_production_controls.py \
            docs/production-readiness/ACTIVATION_RUNBOOK.md \
            docs/production-readiness/CONTROL_MATRIX.md \
            .mff-target-id/production_guard.tf.b64 \
            .mff-target-id/production-iac.yml.b64
          git commit -m 'Bind live funds to exact production target identity'
          git fetch origin musitu-financial-fabric-production-readiness
          test "$(git rev-parse origin/musitu-financial-fabric-production-readiness)" = "$GITHUB_SHA"
          git push origin HEAD:musitu-financial-fabric-production-readiness

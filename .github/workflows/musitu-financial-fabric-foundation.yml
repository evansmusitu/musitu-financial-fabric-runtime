name: MUSITU Financial Fabric — Foundation Runtimes

on:
  push:
    branches: [musitu-financial-fabric, musitu-financial-fabric-production-readiness]
    paths:
      - 'control/musitu-financial-fabric/**'
      - '.github/workflows/musitu-financial-fabric-*.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MUSITU_POSTGRES_CI_IMAGE: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
  MUSITU_TIGERBEETLE_CI_IMAGE: ghcr.io/tigerbeetle/tigerbeetle@sha256:b140e2285fcc1ccd6a7a38a1e31ef13f98c3b511b29acc0a935d597546aa96ff
  MUSITU_NATS_CI_IMAGE: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
  MUSITU_VALKEY_CI_IMAGE: valkey/valkey@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
  MUSITU_CLICKHOUSE_CI_IMAGE: clickhouse/clickhouse-server@sha256:fa394da808cc53f76d0344429421d6c422a6ee85fe7450135c0e3cff4df9bcbb
  MUSITU_OPA_CI_IMAGE: openpolicyagent/opa@sha256:1b9ca9be95e6867ac658bfd3aa36804064c06017c7977759de68e9dd00de37fb

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify mandatory manifest
        run: |
          python - <<'PY'
          import json
          p=json.load(open('control/musitu-financial-fabric/required-components.json'))
          assert p['all_required'] is True
          assert len(p['components']) == 39, len(p['components'])
          assert len(set(p['components'])) == 39
          print('MUSITU mandatory component count:', len(p['components']))
          PY

  tigerbeetle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start pinned TigerBeetle
        run: |
          mkdir -p "$RUNNER_TEMP/tb-data"
          docker run --rm --security-opt seccomp=unconfined \
            -v "$RUNNER_TEMP/tb-data:/data" "$MUSITU_TIGERBEETLE_CI_IMAGE" \
            format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle
          docker run -d --name musitu-tigerbeetle --security-opt seccomp=unconfined \
            -p 3000:3000 -v "$RUNNER_TEMP/tb-data:/data" "$MUSITU_TIGERBEETLE_CI_IMAGE" \
            start --addresses=0.0.0.0:3000 --cache-grid=256MiB /data/0_0.tigerbeetle
      - name: Verify TigerBeetle socket
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/3000) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs musitu-tigerbeetle
          exit 1

  data-event-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start PostgreSQL
        run: docker run -d --name musitu-postgres -e POSTGRES_PASSWORD=musitu-ci -p 5432:5432 "$MUSITU_POSTGRES_CI_IMAGE"
      - name: Start NATS JetStream
        run: docker run -d --name musitu-nats -p 4222:4222 -p 8222:8222 "$MUSITU_NATS_CI_IMAGE" -js -m 8222
      - name: Start Valkey
        run: docker run -d --name musitu-valkey -p 6379:6379 "$MUSITU_VALKEY_CI_IMAGE"
      - name: Start ClickHouse
        run: docker run -d --name musitu-clickhouse -p 8123:8123 "$MUSITU_CLICKHOUSE_CI_IMAGE"
      - name: Start OPA
        run: docker run -d --name musitu-opa -p 8181:8181 "$MUSITU_OPA_CI_IMAGE" run --server --addr=0.0.0.0:8181
      - name: Verify foundation services
        run: |
          for i in {1..60}; do docker exec musitu-postgres pg_isready -U postgres && break || sleep 1; done
          docker exec musitu-postgres pg_isready -U postgres
          for i in {1..30}; do curl -fsS http://127.0.0.1:8222/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:8222/healthz
          docker exec musitu-valkey valkey-cli ping | grep -q PONG
          for i in {1..60}; do curl -fsS http://127.0.0.1:8123/ping && break || sleep 1; done
          curl -fsS http://127.0.0.1:8123/ping | grep -q Ok
          for i in {1..30}; do curl -fsS http://127.0.0.1:8181/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8181/health
      - name: Verify resolved foundation image identities
        if: always()
        run: |
          for name in musitu-postgres musitu-nats musitu-valkey musitu-clickhouse musitu-opa; do
            image="$(docker inspect "$name" --format '{{.Config.Image}}' 2>/dev/null || true)"
            [ -n "$image" ] || continue
            printf '%s %s ' "$name" "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}' || true
          done | tee /tmp/musitu-foundation-image-identities.txt
          grep -F 'nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927' /tmp/musitu-foundation-image-identities.txt
          grep -F 'valkey/valkey@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1' /tmp/musitu-foundation-image-identities.txt
          grep -F 'clickhouse/clickhouse-server@sha256:fa394da808cc53f76d0344429421d6c422a6ee85fe7450135c0e3cff4df9bcbb' /tmp/musitu-foundation-image-identities.txt
          grep -F 'openpolicyagent/opa@sha256:1b9ca9be95e6867ac658bfd3aa36804064c06017c7977759de68e9dd00de37fb' /tmp/musitu-foundation-image-identities.txt

  tooling:
    runs-on: ubuntu-24.04
    env:
      OPENAPI_GENERATOR_VERSION: '7.24.0'
      SCARF_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - name: Install API tooling at exact versions
        run: npm install -g @openapitools/openapi-generator-cli@2.41.0 @stoplight/prism-cli@5.16.0
      - name: Select exact OpenAPI Generator runtime
        run: openapi-generator-cli version-manager set "$OPENAPI_GENERATOR_VERSION"
      - name: Verify tooling identities
        run: |
          test "$(node --version)" = 'v24.18.0'
          cosign version | grep -F 'GitVersion:    v2.5.2'
          tofu version | grep -F 'OpenTofu v1.12.6'
          npm list -g --depth=0 | tee /tmp/musitu-foundation-global-npm.txt
          grep -F '@openapitools/openapi-generator-cli@2.41.0' /tmp/musitu-foundation-global-npm.txt
          grep -F '@stoplight/prism-cli@5.16.0' /tmp/musitu-foundation-global-npm.txt
          generator_version="$(openapi-generator-cli version | tail -n 1 | tr -d '\r')"
          test "$generator_version" = "$OPENAPI_GENERATOR_VERSION"
          prism --version
